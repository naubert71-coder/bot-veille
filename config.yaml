name: "Ma veille"

sources:
  # Flux RSS classiques (revues, blogs, news). Remplacez par vos propres flux.
  rss:
    - url: "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"
    - url: "https://www.nature.com/nature.rss"
  # Hash d'une recherche PubMed sauvegardée (optionnel).
  # https://pubmed.ncbi.nlm.nih.gov -> lancez votre recherche -> RSS -> copiez le hash dans l'URL.
  pubmed_query: ""
  # Flux Google Alerts (optionnel).
  google_alerts: []

triage:
  prompt_file: "prompts/biblio.md"
  # Adaptez selon les modèles accessibles avec VOTRE clé Gemini.
  # Vérifiez la liste sur https://aistudio.google.com
  model_chain:
    - "gemini-3.1-flash-lite"
    - "gemini-3.6-flash"
    - "gemini-3.8-flash"
  max_items: 100
  dedupe: true

output:
  format: "cards"
  subject_prefix: "📚 Veille"
  window_hours: 24

transport:
  smtp_host: "smtp.gmail.com"
  smtp_port: 465
