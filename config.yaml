name: "My watch"

sources:
  # Standard RSS feeds (journals, blogs, news). Replace with your own feeds.
  rss:
    - url: "https://feeds.bbci.co.uk/news/science_and_environment/rss.xml"
    - url: "https://www.nature.com/nature.rss"
  # Hash of a saved PubMed search (optional).
  # https://pubmed.ncbi.nlm.nih.gov -> run your search -> RSS -> copy the hash from the URL.
  pubmed_query: ""
  # Google Alerts feeds (optional).
  google_alerts: []

triage:
  prompt_file: "prompts/biblio.md"
  # Adjust to the models accessible with YOUR Gemini key.
  # Check the list at https://aistudio.google.com
  model_chain:
    - "gemini-3.1-flash-lite"
    - "gemini-3.6-flash"
    - "gemini-3.8-flash"
  max_items: 100
  dedupe: true

output:
  format: "cards"
  subject_prefix: "📚 Watch"
  window_hours: 24
  # Set to false to receive no email on days with nothing new.
  send_if_empty: true

transport:
  smtp_host: "smtp.gmail.com"
  smtp_port: 465
