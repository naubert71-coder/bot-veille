# Example configuration: high-end scientific watch.
# Copy this file to config.yaml and adapt it.

name: "My scientific watch"

sources:
  rss:
    # Top-tier generalist journals
    - url: "https://www.nature.com/nature.rss"
    - url: "https://www.science.org/rss/news_current.xml"
    # Preprints
    - url: "https://connect.biorxiv.org/biorxiv_xml.php?subject=cell_biology"
    - url: "https://connect.medrxiv.org/medrxiv_xml.php?subject=oncology"
  # Hash of a saved PubMed search (replace with your own).
  pubmed_query: "YOUR_PUBMED_HASH_HERE"
  google_alerts: []

triage:
  prompt_file: "prompts/biblio.md"
  model_chain:
    - "gemini-3.1-flash-lite"
    - "gemini-3.6-flash"
    - "gemini-3.8-flash"
  max_items: 100
  dedupe: true

output:
  format: "cards"
  subject_prefix: "📚 Watch"
  window_hours: 24
  send_if_empty: true

transport:
  smtp_host: "smtp.gmail.com"
  smtp_port: 465
